<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دَنگی</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Tahoma,Arial,sans-serif}header{background:#0a1f2e;color:#fff;padding:18px;position:sticky;top:0}.app{max-width:800px;margin:auto;padding:14px 14px 90px}.screen{display:none}.screen.on{display:block}.card{background:#fff;border:1px solid #d5e7e0;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px;background:#0a1f2e;color:#fff}input,select,textarea{width:100%;padding:10px;border:1px solid #c8e2d6;border-radius:10px;margin:4px 0}.muted{font-size:12px;color:#6b7890}.stat{font-size:22px;font-weight:bold}.green{color:#0f9b73}.red{color:#a3253f}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;overflow:auto}.nav button{background:transparent;color:#0a1f2e;min-width:75px}.lock{position:fixed;inset:0;background:#0a1f2e;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.lock .card{width:100%;max-width:330px;text-align:center}.pill{background:#e4f2ec;padding:5px 8px;border-radius:20px;font-size:11px}.item{border-bottom:1px solid #eee;padding:10px 0}.danger{background:#fff0ef;color:#a3253f}.secondary{background:#e4f2ec;color:#0a1f2e}</style><div id="lock" class="lock"><div class="card"><h1>دَنگی</h1><p class="muted" id="lockmsg">ورود امن</p><input id="pin" type="password" placeholder="رمز عبور"><button onclick="unlock()">ورود</button><button class="secondary" id="bio" onclick="biometric()">👆 ورود با اثر انگشت</button><div id="err" class="red muted"></div></div></div><header><div class="row between"><div><b style="font-size:25px">دَنگی</b><div style="font-size:11px;color:#a8c9d4">مدیریت پروژه، آدم‌ها و حساب‌ها</div></div><button onclick="lockNow()">🔒</button></div></header><main class="app"><section id="home" class="screen on"><h2>داشبورد</h2><div class="grid"><div class="card"><div class="muted">پروژه‌ها</div><div id="kp" class="stat"></div></div><div class="card"><div class="muted">آدم‌ها</div><div id="kpe" class="stat"></div></div><div class="card"><div class="muted">پیگیری باز</div><div id="kf" class="stat"></div></div><div class="card"><div class="muted">مانده مالی</div><div id="km" class="stat"></div></div></div><div class="card"><b>پیگیری‌های نزدیک</b><div id="hf"></div></div></section><section id="projects" class="screen"><button onclick="go('home')">🏠 خانه</button><h2>پروژه‌ها</h2><div class="card"><input id="pc" placeholder="کد پروژه"><input id="pn" placeholder="نام پروژه"><input id="pb" type="number" placeholder="مبلغ کل پروژه"><button onclick="addProject()">ثبت پروژه</button></div><div id="pl"></div></section><section id="people" class="screen"><button onclick="go('home')">🏠 خانه</button><h2>آدم‌ها</h2><div class="card"><input id="xn" placeholder="نام شخص"><input id="xr" placeholder="نقش"><input id="xt" type="number" placeholder="کل مبلغ حساب"><input id="xp" placeholder="پروژه‌ها"><textarea id="xx" placeholder="یادداشت"></textarea><button onclick="addPerson()">ثبت شخص</button></div><div id="xl"></div></section><section id="money" class="screen"><button onclick="go('home')">🏠 خانه</button><h2>مالی</h2><div class="card"><input id="mt" placeholder="شرح"><input id="mp" placeholder="طرف حساب"><select id="mpr"></select><input id="ma" type="number" placeholder="مبلغ"><select id="mty"><option value="in">دریافتی</option><option value="out">پرداختی</option></select><input id="md" type="date"><button onclick="addMoney()">ثبت تراکنش</button></div><div id="ml"></div></section><section id="follow" class="screen"><button onclick="go('home')">🏠 خانه</button><h2>پیگیری‌ها</h2><div class="card"><input id="ft" placeholder="موضوع پیگیری"><input id="fp" placeholder="از چه کسی؟"><select id="fpr"></select><input id="fd" type="datetime-local"><button onclick="addFollow()">ثبت و یادآوری</button></div><div id="fl"></div></section></main><nav class="nav"><button onclick="go('home')">⌂ خانه</button><button onclick="go('projects')">▣ پروژه</button><button onclick="go('people')">♙ آدم‌ها</button><button onclick="go('money')">﷼ مالی</button><button onclick="go('follow')">↻ پیگیری</button></nav><script>const K='dangi_v4',PK='dangi_pin';let d=JSON.parse(localStorage[K]||'{"projects":[],"people":[],"money":[],"follow":[]}');const save=()=>localStorage[K]=JSON.stringify(d),fmt=n=>new Intl.NumberFormat('fa-IR').format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');render();scrollTo(0,0)}function addProject(){if(!pn.value)return;d.projects.unshift({id:Date.now(),code:pc.value,name:pn.value,budget:+pb.value||0});save();render()}function addPerson(){if(!xn.value)return;d.people.unshift({id:Date.now(),name:xn.value,role:xr.value,total:+xt.value||0,projects:xp.value,note:xx.value});save();render()}function addMoney(){if(!(ma.value>0))return;d.money.unshift({id:Date.now(),title:mt.value,person:mp.value,project:mpr.value,amount:+ma.value,type:mty.value,date:md.value});save();render()}function addFollow(){if(!ft.value)return;let x={id:Date.now(),title:ft.value,person:fp.value,project:fpr.value,date:fd.value,done:false};d.follow.unshift(x);save();schedule(x);render()}function del(t,id){if(t==='follow'&&window.AndroidNotify)AndroidNotify.cancel('follow_'+id);d[t]=d[t].filter(x=>x.id!==id);save();render()}function pay(id){let p=d.people.find(x=>x.id===id),a=+prompt('مبلغ پرداختی به '+p.name);if(!(a>0))return;let pr=prompt('پروژه مربوط',p.projects||'')||'';d.money.unshift({id:Date.now(),title:'پرداخت به '+p.name,person:p.name,project:pr,amount:a,type:'out',date:new Date().toISOString().slice(0,10)});save();render()}function editPerson(id){let p=d.people.find(x=>x.id===id),t=prompt('کل مبلغ حساب',p.total||0);if(t===null)return;p.total=+t||0;p.projects=prompt('پروژه‌های مربوط',p.projects||'')??p.projects;save();render()}function schedule(x){if(window.AndroidNotify&&x.date)AndroidNotify.schedule('follow_'+x.id,'یادآوری پیگیری: '+x.title,(x.person||'')+' '+(x.project||''),x.date)}function render(){kp.textContent=d.projects.length;kpe.textContent=d.people.length;kf.textContent=d.follow.filter(x=>!x.done).length;km.textContent=fmt(d.money.reduce((a,x)=>a+(x.type==='in'?x.amount:-x.amount),0));let opts='<option value="">— بدون پروژه —</option>'+d.projects.map(p=>`<option value="${esc(p.code)}">${esc(p.code)} — ${esc(p.name)}</option>`).join('');mpr.innerHTML=fpr.innerHTML=opts;pl.innerHTML=d.projects.map(p=>{let net=d.money.filter(m=>m.project===p.code).reduce((a,m)=>a+(m.type==='in'?m.amount:-m.amount),0);return `<div class=card><b>${esc(p.code)} — ${esc(p.name)}</b><div class=muted>کل پروژه: ${fmt(p.budget)} · خالص: ${fmt(net)} · مانده: ${fmt((p.budget||0)-net)}</div><button class=danger onclick="del('projects',${p.id})">حذف</button></div>`}).join('');xl.innerHTML=d.people.map(p=>{let paid=d.money.filter(m=>m.person===p.name&&m.type==='out').reduce((a,m)=>a+m.amount,0);return `<div class=card><div class="row between"><b>${esc(p.name)}</b><span class=pill>${esc(p.role||'')}</span></div><div class=muted>پروژه‌ها: ${esc(p.projects||'—')}</div><div>کل: ${fmt(p.total)} · پرداخت‌شده: ${fmt(paid)} · مانده: ${fmt((p.total||0)-paid)}</div><button onclick="pay(${p.id})">+ ثبت پرداخت</button> <button class=secondary onclick="editPerson(${p.id})">ویرایش</button> <button class=danger onclick="del('people',${p.id})">حذف</button></div>`}).join('');ml.innerHTML=d.money.map(m=>`<div class=item><b>${esc(m.title||'تراکنش')}</b> <b class="${m.type==='in'?'green':'red'}">${m.type==='in'?'+':'-'}${fmt(m.amount)}</b><div class=muted>طرف حساب: ${esc(m.person||'—')} · پروژه: ${esc(m.project||'—')} · ${esc(m.date||'')}</div><button class=danger onclick="del('money',${m.id})">حذف</button></div>`).join('');fl.innerHTML=d.follow.map(f=>`<div class=item><b>${esc(f.title)}</b><div class=muted>${esc(f.person)} · ${esc(f.project)} · ${esc((f.date||'').replace('T',' '))}</div><button class=danger onclick="del('follow',${f.id})">حذف</button></div>`).join('');hf.innerHTML=d.follow.filter(x=>!x.done).slice(0,5).map(f=>`<div class=item>${esc(f.title)}<div class=muted>${esc((f.date||'').replace('T',' '))}</div></div>`).join('')||'<div class=muted>پیگیری بازی نیست.</div>'}function initLock(){if(!localStorage[PK]){let p=prompt('برای دَنگی یک رمز حداقل ۴ کاراکتری بساز');if(p&&p.length>=4)localStorage[PK]=p}lockNow()}function lockNow(){lock.style.display='flex';pin.value='';if(window.AndroidBiometric&&AndroidBiometric.isAvailable())bio.style.display='block';else bio.style.display='none'}function unlock(){if(pin.value===localStorage[PK]){lock.style.display='none';last=Date.now()}else err.textContent='رمز اشتباه است'}function biometric(){if(window.AndroidBiometric)AndroidBiometric.authenticate()}window.onBiometricResult=s=>{if(s){lock.style.display='none';last=Date.now()}};let last=Date.now();['click','touchstart','keydown'].forEach(e=>document.addEventListener(e,()=>last=Date.now()));setInterval(()=>{if(lock.style.display==='none'&&Date.now()-last>300000)lockNow()},10000);document.addEventListener('visibilitychange',()=>{if(document.hidden)localStorage.bg=Date.now();else if(Date.now()-(+localStorage.bg||Date.now())>300000)lockNow()});render();initLock();d.follow.filter(x=>!x.done).forEach(schedule)</script></html>
